{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %} SG Carpool{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header class="navbar">
    <div class="navbar-inner">

       
    <a href="{% url 'home' %}" class="logo">
        <img src="{% static 'images/carpool-logo.png' %}" alt="Carpool" class="logo-icon">
        <strong class="logo-name"> SG Car<span>pool</span></strong>
    </a>

        <nav class="nav-links">
            <a href="{% url 'home' %}">Главная</a>

            {% if user.is_authenticated %}
                <span>Привет, {{ user }}!</span>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'register_view' %}" class="btn">
                    Регистрация
                </a>
            {% endif %}
        </nav>

    </div>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer class="footer">
    <div class="container footer-inner">
        <a href="{% url 'home' %}" class="logo">
            SG Car<span>pool</span>
        </a>
        <p>Находи попутчиков. Путешествуй вместе.</p>
        <p>© 2026 Carpool</p>
    </div>
</footer>

</body>
</html>
